# 평가 프로토콜 — 결과를 보기 전 2026-10-09 17:40 KST 동결.
reference_date: 2026-10-09
research_window: [2021-10-09, 2026-10-09]
symbols: [BTCUSDT, ETHUSDT]
bar: 1m                          # 원천. 전략은 이를 리샘플링해 사용
splits:                          # 시간순, 경계 사이 embargo 1일
  train:      [2021-10-09, 2024-09-30]
  validation: [2024-10-01, 2025-09-30]
  test:       [2025-10-01, 2026-10-08]   # 최종 1회만 사용. 튜닝 금지
embargo_days: 1
walk_forward: {train_months: 12, test_months: 3, step_months: 3}
ranking:
  primary: validation net_return / max_drawdown (cost-deducted)
  exclusions: [risk_limit_violation, accounting_error, lookahead_leak]
  min_trades_for_ranking: 30
baselines: [cash, buy_and_hold_1x_btc]
seed: 20261009
freeze_candidates_at: 2026-10-11T18:00:00+09:00
observation_cutoff:   2026-10-12T04:30:00+09:00

# --- 개정 1 (2026-10-09 19:00 KST, test 결과 확인 전) ---------------------------------------
# 사용자 지시("마감까지 공격적으로 고도화")로 개선 라운드를 추가한다. 다중검정 위험을 줄이려고
# 연구 구간 이전의 표본 외 구간을 추가한다. 전략팀은 사용 금지, 독립 평가팀만 사용(--holdout).
# Binance ETHUSDT 무기한 상장(2019-11-27) 이후 데이터 2019-12-01부터, warm-up 120일 확보.
extra_splits:
  holdout_pre: [2020-04-01, 2021-09-30]
round_rules:
  validation_variants_per_team_per_round: 5     # 사전 선언(DECLARATIONS.md)한 것만 validation 실행
  promotion: "validation 비용 차감 수익>0, MDD<10%, 거래≥30, holdout_pre 수익>0, 감사 통과 → 실시간 모의거래 투입"
